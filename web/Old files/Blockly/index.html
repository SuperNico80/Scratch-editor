        <script>
            let pre = document.querySelector(".con")
            pre.textContent += "\n";
            window.onerror = function (mensaje) {
                    pre.textContent += mensaje + "\n";
                };

            window.addEventListener("unhandledrejection", function (e) {
                    pre.textContent += e.reason + "\n";
            });

        <script>
            // 1. Declaras tus funciones normalmente
function miFuncionUno() {
  console.log("¡Funcion Uno ejecutada!");
}

function miFuncionDos() {
  console.log("¡Funcion Dos ejecutada!");
}

// 2. LAS EXONES A WINDOW MANUALMENTE (Crucial para entornos modernos)
window.miFuncionUno = miFuncionUno;
window.miFuncionDos = miFuncionDos;

// 3. Tu código del input se mantiene igual y ahora SÍ funcionará:
const input = document.querySelector(".run")
input.addEventListener("change", function(event) {
  const functionName = event.target.value.trim();

  if (typeof window[functionName] === "function") {
    window[functionName]();
  } else {
    console.error(`No se encontró la función: ${functionName}`);
  }
});

        </script>
